name: Build Game Executables

on:
  push:
    tags:
      - 'v*' # Triggers ONLY when you push a tag like v1.0, v2.1.4, etc.

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # WINDOWS BUILD
    - name: Build Windows Executable
      if: matrix.os == 'windows-latest'
      run: | 
        pyinstaller --onefile --windowed --name "Match Game" --icon "icon.ico" --add-data "assets;assets" --add-data "NotoSansSymbols2-Regular.ttf;." --add-data "icon.png;." main.py
        mv "dist/Match Game.exe" dist/Match-Game-Windows.exe

    # MACOS BUILD
    - name: Build macOS App
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --onefile --windowed --name "Match Game" --icon "icon.icns" --add-data "assets:assets" --add-data "NotoSansSymbols2-Regular.ttf:." --add-data "icon.png:." main.py
        cd dist && zip -r Match-Game-Mac.zip "Match Game.app"

    # LINUX BUILD
    - name: Build Linux Executable
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile --name "Match Game" --add-data "assets:assets" --add-data "NotoSansSymbols2-Regular.ttf:." --add-data "icon.png:." main.py
        mv "dist/Match Game" dist/Match-Game-Linux

    # AUTOMATICALLY PUBLISH STRAIGHT TO THE RELEASES TAB
    - name: Release Game Binaries
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }} # Uses your exact tag name (e.g., v1.0.0) for the release version
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          dist/Match-Game-Windows.exe
          dist/Match-Game-Mac.zip
          dist/Match-Game-Linux
